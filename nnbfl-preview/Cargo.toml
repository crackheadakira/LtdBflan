[package]
name = "nnbfl-preview"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nnbfl-preview"
path = "src/main.rs"

[dependencies]
nnbfl = { path = "../nnbfl" }

wgpu = "29"
winit = "0.30"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
rfd = "0.17"
tomolib = "1.7"

szs = "0.3.7"
bitflags = "2.13.0"
puffin = { git = "https://github.com/EmbarkStudios/puffin", package = "puffin" }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", package = "puffin_egui" }

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
trivial_casts = "allow"
