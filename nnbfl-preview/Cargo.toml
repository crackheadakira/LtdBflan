[package]
name = "nnbfl-preview"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nnbfl-preview"
path = "src/main.rs"

[dependencies]
nnbfl = { path = "../nnbfl" }

wgpu = "29"
winit = "0.30"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
rfd = "0.17"
tomolib = "1.7"
rayon = "1.12"

szs = { git = "https://github.com/snailspeed3/RiiStudio/", rev = "8af2650ca7d13b3447b5d1712acc5dba5b1024ea", version = "0.3.7" }
bitflags = "2.13.0"
puffin = { git = "https://github.com/EmbarkStudios/puffin", package = "puffin" }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", package = "puffin_egui" }
egui_ltreeview = "0.8"
thiserror = "2.0.19"
ttf-parser = "0.25"
fontdue = "0.9"

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
future-incompatible = { level = "warn", priority = -1 }
nonstandard-style = { level = "warn", priority = -1 }
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
trivial_casts = "allow"
