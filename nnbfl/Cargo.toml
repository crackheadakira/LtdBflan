[package]
name = "nnbfl"
version = "1.0.6"
edition = "2024"
license = "MIT"

authors = ["Morgan Tali"]
description = "A CLI tool to pack, extract, and test Nintendo Binary File Layout (.bflyt and .bflan) files."
repository = "https://github.com/crackheadakira/nnbfl"
homepage = "https://github.com/crackheadakira/nnbfl"
readme = "README.md"
categories = ["command-line-utilities", "parser-implementations"]
keywords = ["nintendo", "bflyt", "bflan", "modding", "cli"]

[lib]
name = "nnbfl"
path = "src/lib.rs"

[[bin]]
name = "nnbfl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
num_enum = "0.7.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

trivial_casts = "allow"
